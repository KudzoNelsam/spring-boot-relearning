<div class="">
  <div class="overflow-x-auto">
    @if (loading()) {
      <div class="flex align-center justify-center">
        <div class="flex flex-col items-center justify-center py-10 gap-2">
          <span class="text-gray-500 text-sm font-medium animate-pulse">Chargement en cours</span>
          <span class="loading loading-dots loading-md text-primary"></span>
        </div>
      </div>
    } @else {
      <table class="table">
        <!-- head -->
        <thead>
        <tr>
          <th>#</th>
          <th>Title</th>
          <th>Description</th>
          <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <!-- row 1 -->
          @for (task of tasksList(); track task.id) {

            <tr class="">
              <th>{{ task.id }}</th>
              <td>{{ task.title }}</td>
              <td>{{ task.description }}</td>
              <td>
                <div class="badge badge-md badge-soft badge-info">{{ task.status }}</div>
              </td>
            </tr>
          } @empty {
            <p class="text-gray-500 italic">Aucune tâche trouvée.</p>
          }
        </tbody>
      </table>
    }
  </div>


  <div class="flex justify-end mt-4">
    <div class="join">
      @for (page of pages(); track page) {
        <button [class]="current_page() == page ? 'btn-active join-item btn' : 'join-item btn'">{{ page }}</button>
      }
    </div>
  </div>

</div>
